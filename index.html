<!doctype html>
<html lang='ru'>
  <head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>RSS Aggregator</title>
    <link
      rel='stylesheet'
      href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'
    >
  </head>

  <body class='min-vh-100 d-flex flex-column'>
    <main class='flex-grow-1'>
      <section class='container-fluid bg-dark p-5'>
        <div class='row'>
          <div class='col-md-10 col-lg-8 mx-auto text-white'>
            <h1 class='display-3 mb-0'>RSS агрегатор</h1>

            <p class='lead'>
              Начните читать RSS сегодня! Это легко, это красиво.
            </p>

            <form class='rss-form text-body'>
              <div class='row'>
                <div class='col'>
                  <div class='form-floating'>
                    <input
                      id='url-input'
                      class='form-control form-control-lg'
                      aria-label='url'
                      type='text'
                      name='url'
                      required
                      autofocus
                    >
                    <label for='url-input'>Ссылка RSS</label>
                  </div>
                </div>

                <div class='col-auto'>
                  <button class='btn btn-primary btn-lg' type='submit'>
                    Добавить
                  </button>
                </div>
              </div>
            </form>

            <p class='mt-2 mb-0 text-secondary'>
              Пример: https://lorem-rss.hexlet.app/feed
            </p>

            <p id='feedback' class='feedback m-0 position-absolute small'></p>
          </div>
        </div>
      </section>

      <section class='container-fluid container-xxl p-5'>
        <div class='row'>
          <div class='col-lg-8 order-1 mx-auto'>
            <div id='posts' class='posts'></div>
          </div>

          <div class='col-lg-4 order-0 order-lg-1'>
            <div id='feeds' class='feeds'></div>
          </div>
        </div>
      </section>
    </main>

    <div class='modal fade' id='modal' tabindex='-1' aria-hidden='true'>
      <div class='modal-dialog'>
        <div class='modal-content'>
          <div class='modal-header'>
            <h5 class='modal-title'></h5>

            <button
              type='button'
              class='btn-close'
              data-bs-dismiss='modal'
            ></button>
          </div>

          <div class='modal-body'>
            <p class='modal-description'></p>
          </div>

          <div class='modal-footer'>
            <a
              class='btn btn-primary modal-link'
              href='#'
              target='_blank'
              rel='noopener noreferrer'
            >
              Читать полностью
            </a>

            <button
              type='button'
              class='btn btn-secondary'
              data-bs-dismiss='modal'
            >
              Закрыть
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type='module' src='./src/main.js'></script>
  </body>
</html>
